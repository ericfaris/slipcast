name: slipcast

services:
  app:
    build: .
    image: ericfaris/slipcast:latest
    restart: unless-stopped
    # Probes /health/live — the restart-fixable subset of the health report
    # (scheduler up, polling not stalled). Not /health: that also fails on
    # expired cookies and low disk, which a restart cannot fix, so an automated
    # restarter reading it would loop. See app/main.py.
    # NOTE: with restart: unless-stopped, Compose does NOT automatically restart
    # a container Docker marks "unhealthy"; this only makes the status visible
    # (`docker compose ps`, `docker inspect`). ops/autoheal.sh is what actually
    # restarts a wedged container (bounded at 3 per hour, then emails).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 1m
      timeout: 10s
      start_period: 2m
      retries: 3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    environment:
      # External URL used in RSS feed links — must be reachable by your podcast app
      - BASE_URL=https://slipcast.mooseflip.com

      # Web UI login credentials (set in .env file)
      # Multi-user: AUTH_USERS=alice:pass1,bob:pass2 (takes precedence)
      - AUTH_USERS=${AUTH_USERS:-}
      # Single-user fallback (used if AUTH_USERS is not set)
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}

      # How many episodes to keep per channel (older ones are pruned)
      - MAX_EPISODES_PER_CHANNEL=20

      # Also prune episodes older than this many days, on top of the count cap
      # above (0 disables — count cap only).
      - MAX_EPISODE_AGE_DAYS=0

      # Don't download channel videos longer than this many minutes — catches
      # multi-hour livestreams before they eat a channel's disk budget (0
      # disables). One-off downloads are exempt; they only log a warning.
      - MAX_EPISODE_DURATION_MINUTES=0

      # Below this many GB free on the data volume, the oldest episodes across
      # all channels are deleted before polling (0 disables). Always emails.
      - MIN_FREE_DISK_GB=2

      # How often to check channels for new videos (in hours)
      - POLL_INTERVAL_HOURS=2

      # Max channels polled at once by "poll all"/"poll selected"
      - POLL_CONCURRENCY=2

      # Audio codec/bitrate for new downloads. "opus" is roughly half the size
      # of mp3 at equivalent quality but isn't universally supported by podcast
      # apps (notably Apple Podcasts, Pocket Casts) — check before switching.
      # Changing this affects new downloads only; existing files keep their
      # original format.
      - AUDIO_CODEC=mp3
      - AUDIO_BITRATE_KBPS=128

      # Internal data directory — leave this as-is
      - DATA_DIR=/data

      # Uncomment after uploading cookies via the UI
      # - COOKIES_FILE=/data/cookies.txt

      # Email alerts when the cookies file expires / needs re-uploading.
      # Gmail SMTP (same setup as the mobilism-search project). SMTP_PASS must
      # be a Gmail App Password — https://myaccount.google.com/apppasswords
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-ericfaris@gmail.com}
